<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020d0b"/>
      <stop offset="50%" stop-color="#041f1a"/>
      <stop offset="100%" stop-color="#010807"/>
    </linearGradient>
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Crosshair Reticle System -->
  <g transform="translate(300, 400)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.4"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00ff88" stroke-width="2.5" opacity="0.7" filter="url(#emeraldGlow)"/>
    <circle cx="0" cy="0" r="70" fill="rgba(0, 255, 136, 0.05)" stroke="#00ff88" stroke-width="2"/>
    <line x1="-200" y1="0" x2="-40" y2="0" stroke="#00ff88" stroke-width="3" filter="url(#emeraldGlow)"/>
    <line x1="40" y1="0" x2="200" y2="0" stroke="#00ff88" stroke-width="3" filter="url(#emeraldGlow)"/>
    <line x1="0" y1="-200" x2="0" y2="-40" stroke="#00ff88" stroke-width="3" filter="url(#emeraldGlow)"/>
    <line x1="0" y1="40" x2="0" y2="200" stroke="#00ff88" stroke-width="3" filter="url(#emeraldGlow)"/>
    <!-- Center Target Node -->
    <circle cx="0" cy="0" r="8" fill="#ff0055" filter="url(#emeraldGlow)"/>
    <!-- Lock-on markers -->
    <rect x="-90" y="-90" width="30" height="6" fill="#00ffcc"/>
    <rect x="-90" y="-90" width="6" height="30" fill="#00ffcc"/>
    <rect x="60" y="-90" width="30" height="6" fill="#00ffcc"/>
    <rect x="84" y="-90" width="6" height="30" fill="#00ffcc"/>
    <rect x="-90" y="84" width="30" height="6" fill="#00ffcc"/>
    <rect x="-90" y="60" width="6" height="30" fill="#00ffcc"/>
    <rect x="60" y="84" width="30" height="6" fill="#00ffcc"/>
    <rect x="84" y="60" width="6" height="30" fill="#00ffcc"/>
  </g>

  <!-- Futuristic Mech Cannon / Railgun Silhouette -->
  <g transform="translate(300, 600)">
    <polygon points="-80,80 -30,-80 30,-80 80,80" fill="#081813" stroke="#00ff88" stroke-width="3"/>
    <line x1="0" y1="-120" x2="0" y2="-30" stroke="#00f0ff" stroke-width="8" filter="url(#emeraldGlow)"/>
  </g>

  <!-- Badges Top -->
  <g transform="translate(40, 50)">
    <rect width="90" height="28" rx="6" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88" stroke-width="1.2"/>
    <text x="45" y="19" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#00ff88" text-anchor="middle">★ 4.7</text>
  </g>
  <g transform="translate(440, 50)">
    <rect width="120" height="28" rx="6" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88" stroke-width="1.2"/>
    <text x="60" y="19" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle">SHOOTING</text>
  </g>

  <!-- Title Bottom Overlay -->
  <rect x="0" y="730" width="600" height="170" fill="url(#bg)" opacity="0.92"/>
  <text x="300" y="790" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff" text-anchor="middle">
    QUANTUM
  </text>
  <text x="300" y="830" font-family="'Orbitron', sans-serif" font-weight="800" font-size="28" letter-spacing="6" fill="#00ff88" text-anchor="middle" filter="url(#emeraldGlow)">
    STRIKE
  </text>
  <text x="300" y="865" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#a0d6be" text-anchor="middle">
    PRECISION RAILGUN COMBAT SIMULATOR
  </text>
</svg>
