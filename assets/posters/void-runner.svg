<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02000d"/>
      <stop offset="50%" stop-color="#0e0626"/>
      <stop offset="100%" stop-color="#010005"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00a0"/>
    </linearGradient>
    <filter id="synthGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Disintegrating Floating Platforms -->
  <g transform="translate(300, 420)">
    <polygon points="-160,80 -80,80 -40,100 -120,100" fill="#00f0ff" opacity="0.6"/>
    <polygon points="-40,40 60,40 100,60 0,60" fill="#ff00a0" opacity="0.8" filter="url(#synthGlow)"/>
    <polygon points="40,-30 160,-30 200,-10 80,-10" fill="#00f0ff" opacity="0.9" filter="url(#synthGlow)"/>
    <!-- Runner Silhouette jumping -->
    <circle cx="20" cy="-20" r="14" fill="#ffffff" filter="url(#synthGlow)"/>
    <path d="M10,-6 L-10,20 L5,25 L25,12 L35,32" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M18,0 L40,-5 L28,15" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Velocity lines -->
    <line x1="-120" y1="-25" x2="-20" y2="-25" stroke="#ff00a0" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="-160" y1="-10" x2="-40" y2="-10" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 8"/>
  </g>

  <!-- Badges Top -->
  <g transform="translate(40, 50)">
    <rect width="90" height="28" rx="6" fill="rgba(255, 215, 0, 0.2)" stroke="#ffd700" stroke-width="1.2"/>
    <text x="45" y="19" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#ffd700" text-anchor="middle">★ 4.5</text>
  </g>
  <g transform="translate(460, 50)">
    <rect width="100" height="28" rx="6" fill="rgba(255, 0, 160, 0.2)" stroke="#ff00a0" stroke-width="1.2"/>
    <text x="50" y="19" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ff00a0" text-anchor="middle">ARCADE</text>
  </g>

  <!-- Title Bottom Overlay -->
  <rect x="0" y="730" width="600" height="170" fill="url(#bg)" opacity="0.92"/>
  <text x="300" y="790" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff" text-anchor="middle">
    VOID RUNNER
  </text>
  <text x="300" y="830" font-family="'Orbitron', sans-serif" font-weight="800" font-size="26" letter-spacing="6" fill="#00f0ff" text-anchor="middle" filter="url(#synthGlow)">
    SYNTH HORIZON
  </text>
  <text x="300" y="865" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#a5b4fc" text-anchor="middle">
    RHYTHMIC PLATFORMER SPEEDRUN
  </text>
</svg>
