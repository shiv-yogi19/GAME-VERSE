<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040b"/>
      <stop offset="40%" stop-color="#071330"/>
      <stop offset="70%" stop-color="#190733"/>
      <stop offset="100%" stop-color="#010309"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff00a0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Synthwave Neon Sun -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="160" fill="url(#sunGrad)" filter="url(#neon)"/>
    <!-- Sun scanlines -->
    <rect x="-160" y="-10" width="320" height="6" fill="#071330"/>
    <rect x="-160" y="15" width="320" height="10" fill="#071330"/>
    <rect x="-160" y="45" width="320" height="14" fill="#071330"/>
    <rect x="-160" y="80" width="320" height="18" fill="#071330"/>
    <rect x="-160" y="120" width="320" height="24" fill="#071330"/>
  </g>

  <!-- Distant Cyber City Skyline -->
  <g fill="#0b0d1e" opacity="0.9">
    <rect x="20" y="320" width="40" height="180"/>
    <rect x="70" y="280" width="55" height="220"/>
    <rect x="135" y="330" width="50" height="170"/>
    <rect x="195" y="250" width="60" height="250"/>
    <rect x="350" y="270" width="65" height="230"/>
    <rect x="425" y="310" width="45" height="190"/>
    <rect x="480" y="290" width="50" height="210"/>
    <rect x="540" y="340" width="40" height="160"/>
  </g>

  <!-- 3D Perspective Road Grid -->
  <g transform="translate(300, 500)">
    <!-- Perspective lines -->
    <line x1="0" y1="0" x2="-450" y2="400" stroke="#00f0ff" stroke-width="2" filter="url(#neon)"/>
    <line x1="0" y1="0" x2="-250" y2="400" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="0" y1="0" x2="-100" y2="400" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#ff007f" stroke-width="2.5" filter="url(#neon)"/>
    <line x1="0" y1="0" x2="100" y2="400" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="250" y2="400" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="0" y1="0" x2="450" y2="400" stroke="#00f0ff" stroke-width="2" filter="url(#neon)"/>
    <!-- Horizon lines -->
    <line x1="-100" y1="20" x2="100" y2="20" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <line x1="-160" y1="50" x2="160" y2="50" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="-240" y1="100" x2="240" y2="100" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-340" y1="180" x2="340" y2="180" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
    <line x1="-460" y1="300" x2="460" y2="300" stroke="#00f0ff" stroke-width="2.5" filter="url(#neon)"/>
  </g>

  <!-- Futuristic Cyber Supercar Silhouette -->
  <g transform="translate(300, 680)">
    <!-- Neon Underglow -->
    <ellipse cx="0" cy="50" rx="140" ry="25" fill="#00f0ff" opacity="0.6" filter="url(#neon)"/>
    <!-- Car body -->
    <path d="M -110,40 L -80,10 L -40,-15 L 40,-15 L 80,10 L 110,40 L 70,45 L -70,45 Z" fill="#090e24" stroke="url(#carGrad)" stroke-width="3"/>
    <!-- Windshield -->
    <polygon points="-30,-10 30,-10 45,10 -45,10" fill="#00f0ff" opacity="0.75" filter="url(#neon)"/>
    <!-- Cyber Tail Lights -->
    <line x1="-75" y1="32" x2="-20" y2="32" stroke="#ff0055" stroke-width="4" filter="url(#neon)"/>
    <line x1="20" y1="32" x2="75" y2="32" stroke="#ff0055" stroke-width="4" filter="url(#neon)"/>
    <!-- Nitro Exhaust flames -->
    <polygon points="-40,42 -30,42 -35,75" fill="#00f0ff" filter="url(#neon)"/>
    <polygon points="30,42 40,42 35,75" fill="#00f0ff" filter="url(#neon)"/>
  </g>

  <!-- Badges & Ratings Top -->
  <g transform="translate(40, 50)">
    <rect width="90" height="28" rx="6" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="45" y="19" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#00f0ff" text-anchor="middle">★ 4.9</text>
  </g>
  <g transform="translate(460, 50)">
    <rect width="100" height="28" rx="6" fill="rgba(255, 0, 127, 0.2)" stroke="#ff007f" stroke-width="1.2"/>
    <text x="50" y="19" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ff007f" text-anchor="middle">ARCADE</text>
  </g>

  <!-- Title Bottom Overlay -->
  <rect x="0" y="730" width="600" height="170" fill="url(#bg)" opacity="0.92"/>
  <text x="300" y="790" font-family="'Orbitron', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff" text-anchor="middle">
    CYBER NEON
  </text>
  <text x="300" y="830" font-family="'Orbitron', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="6" fill="#00f0ff" text-anchor="middle" filter="url(#neon)">
    OVERDRIVE
  </text>
  <text x="300" y="865" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#a0aed6" text-anchor="middle">
    LIGHTSPEED RACING • SHIV YOGI CERTIFIED
  </text>
</svg>
