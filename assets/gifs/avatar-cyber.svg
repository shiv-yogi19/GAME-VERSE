<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="avBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1045" />
      <stop offset="70%" stop-color="#0a0520" />
      <stop offset="100%" stop-color="#03010a" />
    </radialGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px #00f0ff); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes visorGlow {
      0%, 100% { fill: #00f0ff; }
      50% { fill: #ff007f; }
    }
    .rotating-ring {
      transform-origin: 100px 100px;
      animation: spinRing 12s linear infinite;
    }
    .breathing-head {
      transform-origin: 100px 100px;
      animation: pulseCore 3.5s ease-in-out infinite;
    }
    .blinking-eyes {
      transform-origin: 100px 92px;
      animation: eyeBlink 4s ease-in-out infinite;
    }
    .neon-visor {
      animation: visorGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base circle -->
  <circle cx="100" cy="100" r="95" fill="url(#avBg)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2" />

  <!-- Outer Holographic Compass Ring -->
  <g class="rotating-ring">
    <circle cx="100" cy="100" r="86" fill="none" stroke="url(#neonRing)" stroke-width="2.5" stroke-dasharray="14 10 32 10" filter="url(#avGlow)" />
    <circle cx="100" cy="14" r="3" fill="#00f0ff" />
    <circle cx="186" cy="100" r="3" fill="#ff007f" />
    <circle cx="100" cy="186" r="3" fill="#00ffcc" />
    <circle cx="14" cy="100" r="3" fill="#7000ff" />
  </g>

  <!-- Cybernetic Character Silhouette -->
  <g class="breathing-head">
    <!-- Cyber Shoulders -->
    <path d="M45,175 Q100,140 155,175 L155,195 L45,195 Z" fill="#0e1329" stroke="#7000ff" stroke-width="2" />
    <path d="M70,165 L100,150 L130,165" stroke="#00f0ff" stroke-width="1.5" fill="none" />

    <!-- Helmet / Head Base -->
    <polygon points="65,80 100,45 135,80 130,130 100,148 70,130" fill="#131938" stroke="#00f0ff" stroke-width="2" />

    <!-- Cyber Horns / Antennae -->
    <polygon points="65,75 52,48 60,46 72,70" fill="#ff007f" filter="url(#avGlow)" />
    <polygon points="135,75 148,48 140,46 128,70" fill="#00f0ff" filter="url(#avGlow)" />

    <!-- Cyber Visor / Face Screen -->
    <path d="M74,82 Q100,75 126,82 L122,106 Q100,114 78,106 Z" fill="#060917" stroke="#7000ff" stroke-width="2" />

    <!-- Visor Eye Core -->
    <g class="blinking-eyes">
      <!-- Cybernetic glowing eyes / visor band -->
      <path class="neon-visor" d="M80,92 Q100,88 120,92 L118,97 Q100,93 82,97 Z" filter="url(#avGlow)" />
      <circle cx="92" cy="94" r="2.5" fill="#ffffff" />
      <circle cx="108" cy="94" r="2.5" fill="#ffffff" />
    </g>

    <!-- Jaw Guard Nodes -->
    <circle cx="85" cy="130" r="3" fill="#00f0ff" />
    <circle cx="115" cy="130" r="3" fill="#ff007f" />
    <line x1="94" y1="130" x2="106" y2="130" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
