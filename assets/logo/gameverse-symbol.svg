<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1738" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="4" />
  
  <!-- Circuit Grid Background -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.5">
    <line x1="60" y1="120" x2="452" y2="120" />
    <line x1="60" y1="256" x2="452" y2="256" />
    <line x1="60" y1="392" x2="452" y2="392" />
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="392" y1="60" x2="392" y2="452" />
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 8" />
  </g>

  <!-- Center Crystal Hexagon -->
  <g transform="translate(256, 256) scale(2.2)">
    <!-- Outer Hex -->
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" 
      fill="rgba(112, 0, 255, 0.25)" 
      stroke="url(#crystalGrad)" 
      stroke-width="5" 
      filter="url(#superGlow)" />

    <!-- Inner Geometrical Facets -->
    <polygon points="0,-55 47.6,-27.5 47.6,27.5 0,55 -47.6,27.5 -47.6,-27.5" 
      fill="none" 
      stroke="url(#accentGrad)" 
      stroke-width="2.5" 
      stroke-opacity="0.8" />

    <!-- Stylized Futuristic 'G' & 'V' Core -->
    <path d="M-28,-18 L0,22 L28,-18 M0,22 L0,45" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      filter="url(#superGlow)" />
      
    <!-- Core Reactor Nodes -->
    <circle cx="0" cy="22" r="5" fill="#00f0ff" />
    <circle cx="-35" cy="-5" r="4" fill="#ff007f" />
    <circle cx="35" cy="-5" r="4" fill="#00ffcc" />
    <circle cx="0" cy="-45" r="4" fill="#ffffff" />
  </g>
</svg>
